# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Getting started"
# Optionally set API keys here instead of exporting environment variables.
# Never commit real keys to source control.
# env:
#   OPENAI_API_KEY: sk-...
prompts:
  - "How many eyes has {{animal}}?"
  - "Hi"

providers:
  - id: file://./agy_provider.py
    label: "Antigravity Subscription Model"
    config:
      model: "gemini-3.8-flash-low"

defaultTest:
  options:
    provider:
      id: "file://./agy_provider.py"
      config:
        model: "gemini-3.8-flash-high"

tests:
  - vars:
      animal: "cat"
    assert:
      # Детерминированная проверка
      - type: equals
        value: 2
      # Проверка через LLM-судью (вызовет agy_provider.py)
      - type: llm-rubric
        value: "has 2 eyes."
